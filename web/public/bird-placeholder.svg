<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Placeholder bird illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef0fe"/>
      <stop offset="55%" stop-color="#eaf1ee"/>
      <stop offset="100%" stop-color="#e3e6f7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d78ee"/>
      <stop offset="100%" stop-color="#5b54dd"/>
