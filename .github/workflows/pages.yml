name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Pages serves files; it cannot run the review queue's write path. Both the
      # POST route and the per-request render of /review are dropped here rather
      # than from the repository, so `next dev` keeps working as it does now.
      - name: Drop the write path
        run: |
          rm -rf app/api
          sed -i '/export const dynamic = "force-dynamic";/d' app/review/page.tsx

      - name: Build
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_READ_ONLY: "1"

      # Jekyll never runs on an artifact deploy, but _next/ would be skipped if it did.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
